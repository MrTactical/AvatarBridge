name: Feature request / support suggestion
description: Ask for a new conversion feature, or support for another package
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggestions are welcome — VRCFury, Modular Avatar and ARKit blendshape support all started as issues here.

  - type: textarea
    id: what
    attributes:
      label: What would you like AvatarBridge to do?
      placeholder: |
        e.g. "Support <package> avatars" or "Convert <VRChat feature> to <CVR equivalent>"
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: What's the problem it solves?
      description: What do you have to do by hand today?
    validations:
      required: true

  - type: input
    id: links
    attributes:
      label: Links
      description: The package, docs, or an example avatar — anything that shows how it's meant to work.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        **One standing note on face tracking:** AvatarBridge won't ship FT solutions that don't fit ChilloutVR's
        limits. The full Jerry's Templates / Pawlygon rigs use binary encoding plus per-parameter smoothing that
        totals roughly **4,198 synced bits against CVR's 3,200 hard cap** — they can't sync, so they aren't an
        option regardless of preference. If you want to bring your own rig, set **Face tracking → None** and wire
        it up yourself; the rest of the conversion won't touch it.
